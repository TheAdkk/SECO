[workspace]
resolver = "3"
members = [
    "framework/seco-core",
    "framework/seco-clap",
    "framework/seco-dsp",
    "plugins/zape",
    "plugins/neta",
    "plugins/neta/bridge",
    "plugins/neta/meter",
    "plugins/neta/visual",
    "plugins/neta/wgpu",
    "xtask",
]

# `neta-app` depends on `dalia-core` through a path that leaves this
# repository, so cargo cannot even load the workspace manifest anywhere the
# sibling checkout is absent — CI included. Excluded until that dependency is
# reachable from a clone; the binary still builds with
# `cargo build --manifest-path plugins/neta/app/Cargo.toml`.
exclude = ["plugins/neta/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[patch.crates-io]
# VST3 host-idle timers must use wall time. clap-wrapper 0.3.1 used process
# CPU time on macOS/Linux, making idle-driven editors stutter in DAWs.
#
# Vendored at the workspace root rather than under a plugin: this patch is
# declared here and both Zape and Neta build VST3 through it, so it never
# belonged to either one.
clap-wrapper = { path = "vendor/clap-wrapper" }
