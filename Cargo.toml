[workspace]
resolver = "3"
members = [
    "framework/seco-core",
    "framework/seco-clap",
    "framework/seco-dsp",
    "plugins/zape",
    "plugins/neta",
    "plugins/neta/bridge",
    "plugins/neta/meter",
    "plugins/neta/visual",
    "plugins/neta/wgpu",
    "plugins/neta/app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[patch.crates-io]
# VST3 host-idle timers must use wall time. clap-wrapper 0.3.1 used process
# CPU time on macOS/Linux, making idle-driven editors stutter in DAWs.
clap-wrapper = { path = "plugins/neta/vendor/clap-wrapper" }
