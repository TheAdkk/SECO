[package]
name = "neta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# VST3 export via free-audio's clap-wrapper, as in zape.
vst3 = ["dep:clap-wrapper"]
# Embedded editor (macOS); see seco-clap's gui feature.
gui = ["seco-clap/gui"]

[dependencies]
neta-meter = { path = "meter" }
seco-core = { path = "../../framework/seco-core" }
seco-clap = { path = "../../framework/seco-clap" }
clap-wrapper = { version = "0.3.1", default-features = false, features = [
    "vst3",
], optional = true }
