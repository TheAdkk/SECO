[package]
name = "zape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# VST3 export via free-audio's clap-wrapper (C++, embedded VST3 SDK — MIT),
# built by the `clap-wrapper` crate with cc, no cmake. Off by default: the
# plain build ships CLAP only, and seco-core/seco-clap know nothing of this.
vst3 = ["dep:clap-wrapper"]
# Embedded WKWebView editor (macOS); see seco-clap's gui feature.
gui = ["seco-clap/gui"]

[dependencies]
seco-core = { path = "../../seco-core" }
seco-clap = { path = "../../seco-clap" }
seco-dsp = { path = "../../seco-dsp" }
clap-wrapper = { version = "0.3.1", default-features = false, features = [
    "vst3",
], optional = true }
